name: Windows acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse PowerShell
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1' } | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in @($errors)) {
              $failed = $true
              Write-Host "::error file=$($parseError.Extent.File),line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }
      - name: Install dependencies
        shell: powershell
        timeout-minutes: 10
        run: .\Install-Dependencies.ps1 -Force -TestForceStandaloneSevenZip
      - name: Run acceptance tests
        shell: powershell
        timeout-minutes: 10
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $rc = 0
          # Child stderr must be logged, not turned into a terminating error by the step's default 'Stop'.
          $ErrorActionPreference = 'Continue'
          foreach ($suite in @(@('Test-WorkspaceShare', 'test-output'), @('Test-LifecycleHardening', 'lifecycle-output'), @('Test-NativeRunnerSmoke', 'native-runner-output'), @('Test-WorkspaceShareGui.Http', 'gui-http-output'), @('Test-WorkspaceShareGui', 'gui-output'))) {
            $global:LASTEXITCODE = 0
            # Each suite runs in its own process (no state leaks between suites; errors keep their position).
            try { & (Join-Path $PSHOME 'powershell.exe') -NoLogo -NoProfile -File ".\tests\$($suite[0]).ps1" *>&1 | Tee-Object -FilePath "artifacts\$($suite[1]).txt" }
            catch { Write-Host "::error::$($suite[0]) threw: $($_.Exception.Message)`n$($_.InvocationInfo.PositionMessage)`n$($_.ScriptStackTrace)"; $global:LASTEXITCODE = 1 }
            if ($LASTEXITCODE -ne 0 -and $rc -eq 0) { $rc = $LASTEXITCODE }
          }
          exit $rc
      - name: Upload sanitized failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-acceptance-failure-${{ github.run_id }}
          path: artifacts
          if-no-files-found: ignore
          retention-days: 7
