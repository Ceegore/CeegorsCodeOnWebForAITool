name: Linux release package (experimental)

# Builds dist/WorkspaceShare-<version>-linux-x64.tar.gz from the released tag and attaches it to that
# GitHub release. The Windows ZIP is built and uploaded with scripts/Build-InternalRelease.ps1.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v3.5.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Check tag and VERSION
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid tag: $TAG"; exit 1; }
          version="$(tr -d '[:space:]' < VERSION)"
          [ "v$version" = "$TAG" ] || { echo "::error::VERSION ($version) does not match tag $TAG"; exit 1; }

      - name: Install helper packages
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils xz-utils curl

      - name: Install dependencies (linux-x64, pinned SHA-256)
        shell: pwsh
        timeout-minutes: 10
        run: ./Install-Dependencies.ps1 -Force

      - name: Release gate (tests)
        shell: bash
        timeout-minutes: 25
        run: |
          rc=0
          for suite in Test-LinuxPlatform Test-WorkspaceShareGui.Http Test-WorkspaceShare Test-NativeRunnerSmoke; do
            echo "::group::$suite"
            set +e
            timeout 1200 pwsh -NoLogo -NoProfile -File "tests/$suite.ps1" 2>&1 | tee "$suite.txt"
            code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            echo "$suite exit=$code"
            if [ "$code" -ne 0 ]; then rc=1; grep -a -B1 -A3 '^\[FAIL\]' "$suite.txt" | head -60 || true; fi
          done
          exit $rc

      - name: Build package
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = (git log -1 --format=%ct)
          ./scripts/Build-LinuxRelease.ps1

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c WorkspaceShare-*-linux-x64.tar.gz.sha256.txt
          gh release upload "$TAG" WorkspaceShare-*-linux-x64.tar.gz WorkspaceShare-*-linux-x64.tar.gz.sha256.txt --clobber --repo "$GITHUB_REPOSITORY"
